<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Personal Details</title>
</head>
<body>
	<main>
		<h1>Personal Details</h1>
		<form action="#" method="post">
			<p>
				<label for="full-name">Full name</label><br>
				<input type="text" id="full-name" name="full_name" autocomplete="name" required>
			</p>
			<p>
				<label for="email">Email address</label><br>
				<input type="email" id="email" name="email" autocomplete="email" required>
			</p>
			<p>
				<label for="phone">Phone number</label><br>
				<input type="tel" id="phone" name="phone" autocomplete="tel">
			</p>
			<p>
				<label for="birth-date">Date of birth</label><br>
				<input type="date" id="birth-date" name="birth_date">
			</p>
			<p>
				<label for="address">Address</label><br>
				<textarea id="address" name="address" rows="4" autocomplete="street-address"></textarea>
			</p>
			<button type="submit">Save details</button>
		</form>
	</main>
</body>
</html>
