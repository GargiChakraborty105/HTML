<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HTML Lists</title>
</head>
<body>
	<h1>HTML Lists</h1>

	<h2>Unordered List</h2>
	<ul>
		<li>Apples</li>
		<li>Bananas</li>
		<li>Oranges</li>
	</ul>

	<h2>Ordered List</h2>
	<ol>
		<li>Wake up</li>
		<li>Have breakfast</li>
		<li>Start the day</li>
	</ol>

	<h2>Description List</h2>
	<dl>
		<dt>HTML</dt>
		<dd>A language used to structure web pages.</dd>
		<dt>CSS</dt>
		<dd>A language used to style web pages.</dd>
	</dl>
</body>
</html>
