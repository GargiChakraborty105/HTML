<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HTML Text Formatting</title>
</head>
<body>
	<h1>HTML Text Formatting</h1>

	<p><b>Bold text</b> and <strong>important text</strong></p>
	<p><i>Italic text</i> and <em>emphasized text</em></p>
	<p><u>Underlined text</u> and <mark>highlighted text</mark></p>
	<p><small>Smaller text</small> and <del>deleted text</del></p>
	<p><ins>Inserted text</ins> and H<sub>2</sub>O with x<sup>2</sup></p>
	<p><code>console.log("Hello, world!");</code></p>
</body>
</html>
